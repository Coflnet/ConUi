name: relationship_manager
description: A relationship and contact management app with cross-device sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  sqflite_common: ^2.5.0
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.1.1
  path_provider: ^2.1.1
  uuid: ^4.2.2
  encrypt: ^5.0.3
  crypto: ^3.0.3
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  intl: ^0.20.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  permission_handler: ^11.1.0
  file_picker: ^10.3.10
  flutter_file_dialog: ^3.3.3
  share_plus: ^12.0.2
  image_picker: ^1.0.4
  audioplayers: ^5.2.1
  path: ^1.8.3
  mime: ^2.0.0
  collection: ^1.18.0
  idb_shim: ^2.9.9
  record: ^7.1.1
  web: ^1.1.0
  geolocator: ^13.0.1
  archive: ^4.2.0
  flutter_contacts: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
  fonts:
    # Bundled so the web build never requests fonts.gstatic.com for the
    # Material default font (Roboto) or a symbol fallback - see
    # assets/fonts/README.md.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf
