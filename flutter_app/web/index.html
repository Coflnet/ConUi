<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bewahren Sie familiäre Beziehungen und die dazugehörigen Geschichten, einschließlich Audioaufnahmen.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Relationship Manager">
  <meta name="theme-color" content="#3f51b5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Relationship Manager</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start the local database download alongside Flutter, before Dart initializes it. -->
  <link rel="preload" href="sqlite3.wasm" as="fetch" type="application/wasm" crossorigin>
</head>
<body>
  <script src="vad/ort.wasm.min.js"></script>
  <script src="flutter_bootstrap.js" async></script>
