version: '3.8'

services:
  # ScyllaDB for sync metadata storage
  scylladb:
    image: scylladb/scylla:5.4
    container_name: relationship-scylla
    ports:
      - "9042:9042"
      - "9160:9160"
    environment:
      - SCYLLA_SEEDS=scylladb
    volumes:
      - scylla_data:/var/lib/scylla
    command: --smp 1 --memory 512M --overprovisioned 1 --api-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO for S3-compatible blob storage
  minio:
    image: minio/minio:latest
    container_name: relationship-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Initialize MinIO bucket. The backend also creates the bucket itself on first use, but doing
  # it here means it (and the "no public access" policy below) already exist before the first
  # request.
  minio-init:
    image: minio/mc:latest
    container_name: relationship-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/relationship-blobs --ignore-existing;
      mc anonymous set none myminio/relationship-blobs;
      echo 'Bucket created successfully';
      "

  # ASP.NET Backend API
  backend:
    build:
      context: ./backend/RelationshipManager.Api
      dockerfile: Dockerfile
    container_name: relationship-backend
    ports:
      - "5000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8000
      # Dev-only login endpoint (POST /api/auth/dev) - only ever active in Development, and only
      # when this is explicitly true (it defaults to false, including in Development).
      - ENABLE_DEV_AUTH=true
      # Cassandra: the app connects without a keyspace, creates it if missing with this
      # replication, then switches to it - it owns its own schema, so nothing besides the
      # keyspace needs to be pre-created.
      - CASSANDRA__HOSTS=scylladb
      - CASSANDRA__KEYSPACE=relationship_manager
      - CASSANDRA__USER=cassandra
      - CASSANDRA__PASSWORD=cassandra
      - CASSANDRA__REPLICATION_CLASS=SimpleStrategy
      - CASSANDRA__REPLICATION_FACTOR=1
      - S3__ENDPOINT=http://minio:9000
      - S3__ACCESS_KEY=minioadmin
      - S3__SECRET_KEY=minioadmin123
      - S3__BUCKET=relationship-blobs
      - S3__USE_PATH_STYLE=true
      - jwt__issuer=relationship-manager
      - jwt__secret=DevSecretKeyThatIsAtLeast32CharactersLong!
    depends_on:
      scylladb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  scylla_data:
  minio_data:

networks:
  default:
    name: relationship-network
